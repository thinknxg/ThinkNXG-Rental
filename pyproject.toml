[project]
name = "thinknxg_rental"
authors = [{ name = "thinkNXG", email = "info@thinknxg.com" }]
description = "Formwork and scaffolding rental for ERPNext: hire orders, contracts, dispatch, material at site, recurring billing, off-hire, damage settlement and cross hire"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
